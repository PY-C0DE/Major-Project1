version: '3.8'

services:
  # Full-Stack Application (Express + Vite + ML Services)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017
      - DATABASE_NAME=ai_stock_intelligence
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOW_DEMO_MODE=${ALLOW_DEMO_MODE:-false}
    depends_on:
      - mongo
    restart: unless-stopped

  # MongoDB Persistence Database
  mongo:
    image: mongo:7.0
    container_name: alphaquant_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
