version: '3.8'

services:
  # Full-Stack Application (Express + Vite + ML Services)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SQL_HOST=postgres
      - SQL_PORT=5432
      - SQL_USER=${SQL_USER:-alphaquant}
      - SQL_PASSWORD=${SQL_PASSWORD:?Set SQL_PASSWORD in your .env file}
      - SQL_DB_NAME=${SQL_DB_NAME:-alphaquant}
      - JOB_QUEUE_BACKEND=bullmq
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOW_DEMO_MODE=${ALLOW_DEMO_MODE:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Persistence Database
  postgres:
    image: postgres:16-alpine
    container_name: alphaquant_postgres
    restart: always
    environment:
      - POSTGRES_USER=${SQL_USER:-alphaquant}
      - POSTGRES_PASSWORD=${SQL_PASSWORD:?Set SQL_PASSWORD in your .env file}
      - POSTGRES_DB=${SQL_DB_NAME:-alphaquant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-alphaquant} -d ${SQL_DB_NAME:-alphaquant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (Durable BullMQ Job Queue)
  redis:
    image: redis:7-alpine
    container_name: alphaquant_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
